apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader-1
  namespace: todoapp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-to-read-secrets
  namespace: todoapp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-reader-binding
  namespace: todoapp
subjects:
  - kind: ServiceAccount
    name: secrets-reader-1
    namespace: todoapp
roleRef:
  kind: Role
  name: role-to-read-secrets
  apiGroup: rbac.authorization.k8s.io
